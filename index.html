<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện ảnh tương tác</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>Thư viện ảnh tương tác</h1>
        <p id="image-display">Di chuột hoặc sử dụng phím Tab để xem ảnh chi tiết.</p>
    </header>

    <main class="gallery">
        <!-- 6 hình ảnh kèm theo alt text hỗ trợ truy cập -->
        <img class="preview" src="https://picsum.photos/id/10/200/150" alt="Cảnh rừng núi xanh tươi ban sáng" tabindex="0">
        <img class="preview" src="https://picsum.photos/id/11/200/150" alt="Con đường nhỏ chạy qua cánh đồng" tabindex="0">
        <img class="preview" src="https://picsum.photos/id/12/200/150" alt="Bờ biển đá sóng vỗ êm đềm" tabindex="0">
        <img class="preview" src="https://picsum.photos/id/13/200/150" alt="Rừng phong mùa thu lá đỏ" tabindex="0">
        <img class="preview" src="https://picsum.photos/id/14/200/150" alt="Bờ biển tảng đá xanh rêu" tabindex="0">
        <img class="preview" src="https://picsum.photos/id/15/200/150" alt="Thác nước nhỏ chảy qua ghềnh đá" tabindex="0">
    </main>

</body>
</html>
